{{ define "main" }}
<div class="servers-page page-content container">

  <div class="servers-header">
    <h1>Servers</h1>
    <p class="servers-subtitle">
      Live public servers. Click a row to see players.
      <span id="servers-refresh-status"></span>
    </p>
  </div>

  <div class="servers-controls">
    <label class="servers-filter-label">
      <input type="checkbox" id="hideEmpty"> Hide empty
    </label>
    <label class="servers-filter-label">
      <input type="checkbox" id="hideBots"> Hide bots
    </label>
  </div>

  <div id="servers-list">
    <div class="servers-loading">Loading…</div>
  </div>

</div>
<link rel="stylesheet" href="/css/stats.css">
<script src="/js/servers.js"></script>
{{ end }}
