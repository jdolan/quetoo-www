<header class="site-header">
  <nav class="nav-container">
    <a href="/" class="logo">
      <img src="/images/logo.png" alt="Quetoo" height="36">
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL }}" class="{{ with .Params.class }}{{ . }} {{ end }}{{ if $.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}</a></li>
      {{ end }}
      <li><a href="{{ .Site.Params.discord }}" class="btn-discord">Discord</a></li>
      <li>
        <a href="{{ .Site.Params.sponsor }}" class="btn-sponsor">
          <span class="btn-sponsor-icon" aria-hidden="true">♥</span>
          <span>Sponsor</span>
        </a>
      </li>
    </ul>
  </nav>
</header>
